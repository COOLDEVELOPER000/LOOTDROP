<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootDrop · Free games before they're gone</title>
  <meta name="description" content="Free-to-keep deals and free-to-play games from Steam and Epic — sorted by how fast they expire.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <a class="logo" href="./">LOOT<span>DROP</span></a>
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="q" placeholder="Search games" autocomplete="off">
      </label>
      <div class="filters" role="tablist" aria-label="Platform">
        <button class="filter is-active" data-platform="all">All</button>
        <button class="filter" data-platform="steam">Steam</button>
        <button class="filter" data-platform="epic">Epic</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Featured: the deal expiring soonest -->
    <section class="hero" id="hero" hidden>
      <div class="hero-inner" id="hero-inner"></div>
    </section>

    <!-- Live 100%-off deals -->
    <section class="board" id="sec-now" hidden>
      <div class="board-head">
        <div class="board-titles">
          <span class="eyebrow eyebrow--urgent"><i class="dot"></i>Claim now</span>
          <p class="board-sub">100% off — yours to keep once you claim it</p>
        </div>
        <span class="count" id="count-now"></span>
      </div>
      <div class="grid" id="grid-now"></div>
    </section>

    <!-- Upcoming free games -->
    <section class="board" id="sec-soon" hidden>
      <div class="board-head">
        <div class="board-titles">
          <span class="eyebrow eyebrow--soon">Free soon</span>
          <p class="board-sub">Going free at a set time — check back to claim</p>
        </div>
        <span class="count" id="count-soon"></span>
      </div>
      <div class="grid" id="grid-soon"></div>
    </section>

    <!-- Always-free titles -->
    <section class="board" id="sec-f2p" hidden>
      <div class="board-head">
        <div class="board-titles">
          <span class="eyebrow eyebrow--free">Free to play</span>
          <p class="board-sub">Always free, no time limit</p>
        </div>
        <span class="count" id="count-f2p"></span>
      </div>
      <div class="grid" id="grid-f2p"></div>
    </section>

    <!-- States -->
    <div class="state" id="loading">
      <div class="grid">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>
    </div>
    <div class="state" id="empty" hidden></div>
    <div class="state" id="error" hidden></div>
  </main>

  <footer>
    <p>LootDrop · refreshed hourly from Steam &amp; Epic. Always confirm the price on the store page before claiming.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
